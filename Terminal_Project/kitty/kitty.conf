# ==============================================================================
# FONTS
# ==============================================================================
# Use a Nerd Font for full icon support (e.g., FiraCode, JetBrainsMono, Iosevka)
font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto

font_size        12.0
disable_ligatures never

# ==============================================================================
# PERFORMANCE & RENDERING
# ==============================================================================
repaint_delay    10
input_delay      3
sync_to_monitor  yes

# ==============================================================================
# WINDOW LAYOUT & CUSTOMIZATION
# ==============================================================================
remember_window_size  yes
initial_width         940
initial_height        600

# Add a slight padding for a cleaner visual layout
window_margin_width   0
window_padding_width  8

# Window borders
active_border_color   #00ff00
inactive_border_color #cccccc
hide_window_decorations no

# ==============================================================================
# COLOR SCHEME (Example: Minimal Dark / Tokyo Night inspired)
# ==============================================================================
background            #1a1b26
foreground            #a9b1d6
background_opacity    0.95

# Selection highlight
selection_foreground  #000000
selection_background  #fffacd

# Cursor customization
cursor                #c0caf5
cursor_text_color     #1a1b26
cursor_shape          block
cursor_blink_interval 0

# The 16 terminal colors
# Black
color0 #414868
color8 #414868
# Red
color1 #f7768e
color9 #f7768e
# Green
color2  #73daca
color10 #73daca
# Yellow
color3  #e0af68
color11 #e0af68
# Blue
color4  #7aa2f7
color12 #7aa2f7
# Magenta
color5  #bb9af7
color13 #bb9af7
# Cyan
color6  #7dcfff
color14 #7dcfff
# White
color7  #c0caf5
color15 #c0caf5

# ==============================================================================
# TAB BAR
# ==============================================================================
tab_bar_edge            top
tab_bar_style           powerline
tab_powerline_style     slanted
active_tab_foreground   #1a1b26
active_tab_background   #7aa2f7
inactive_tab_foreground #a9b1d6
inactive_tab_background #1f2335

# ==============================================================================
# KEYBINDINGS
# ==============================================================================
# Clear default shortcuts if you want total control, or append new ones
kitty_mod alt

# Window management
map kitty_mod+[     new_window
map kitty_mod+]     close_window
map kitty_mod+.     next_window
map kitty_mod+,     previous_window

# Tab management
map kitty_mod+q     new_tab
map kitty_mod+c     close_tab
map kitty_mod+2     next_tab
map kitty_mod+1     previous_tab

# Miscellaneous
map kitty_mod+equal change_font_size all +2.0
map kitty_mod+minus change_font_size all -2.0
map kitty_mod+backspace change_font_size all 0

# Quick reload config shortcuts
map kitty_mod+f5    load_config_file

# =============================================================================
# Auto nvim entry terminal
# =============================================================================
shell nvim
